<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BBC IPlayer Checker - Results</title>
</head>
<body>
    <h1>Results</h1>
    <h2>The following films in your watchlist are currently available on BBC iPlayer</h2>
    <ul>
        {{range .}}
            <li>
                <a target="_blank" href="https://www.bbc.co.uk/iplayer/episodes/{{.Id}}">{{.Title}}</a>
            </li>
        {{end}}
    </ul>
</body>
</html>
